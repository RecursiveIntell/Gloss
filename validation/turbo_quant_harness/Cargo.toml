[package]
name = "gloss-turbo-quant-runtime-gates"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
gloss-native-contract-tests = { path = "../native_harness" }
semantic-memory = { version = "=0.5.15", features = ["turbo-quant-codec"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json", "stream", "rustls"] }

[build-dependencies]
toml = "0.8"

[workspace]

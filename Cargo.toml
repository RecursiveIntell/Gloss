[workspace]
members = ["src-tauri"]
default-members = ["src-tauri"]
exclude = [
    "src-tauri/vendor",
    "src-tauri/vendor/forge-memory-bridge",
    "src-tauri/vendor/job-queue",
    "src-tauri/vendor/llm-output-parser",
    "src-tauri/vendor/llm-pipeline",
    "src-tauri/vendor/semantic-memory",
    "src-tauri/vendor/semantic-memory-forge",
    "src-tauri/vendor/stack-ids",
    "src-tauri/vendor/tauri-queue",
    "src-tauri/vendor/turbo-quant",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"
expect_used = { level = "warn", priority = -1 }

[workspace.dependencies]
blake3 = "1.8.3"
chrono = "0.4.44"
proptest = "1.10.0"
rusqlite = "0.32.1"
schemars = "0.8.22"
serde = "1.0.228"
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.50.0"
tracing = "0.1.44"
uuid = "1.22.0"

name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        # This runs before native dependency installation to fail packaging drift early.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify vendored source closure
        run: |
          python3 validation/validate_vendor_closure.py .
          python3 -m unittest discover -s validation/tests -v

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Native DB, dense publication and SSE contract tests
        run: cargo test --locked --manifest-path validation/native_harness/Cargo.toml

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.8 --locked

      - name: Canonical release verification
        run: npm run verify

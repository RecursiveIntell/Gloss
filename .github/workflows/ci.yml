name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.8 --locked

      - name: Canonical release verification
        run: npm run verify

  desktop-baseline:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install native desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dbus-x11 \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            webkit2gtk-driver \
            wget \
            xvfb

      - name: Install frontend dependencies
        run: npm ci

      - name: Install pinned Tauri WebDriver bridge
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Run native desktop baseline
        run: |
          xvfb-run -a dbus-run-session -- \
            python3 scripts/live_desktop_smoke.py \
              --repo . \
              --require-baseline \
              --output .codex-run-receipts/desktop-baseline

      - name: Preserve native desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gloss-desktop-baseline-${{ github.run_id }}
          path: .codex-run-receipts/desktop-baseline
          include-hidden-files: true
          retention-days: 14

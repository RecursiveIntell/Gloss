[workspace]
# Standalone crate — not part of the parent Libraries workspace.
# The root Cargo.toml also declares a [package] for the poly-kv
# crate whose source lives in src/. The `crates/poly-kv/` and
# `crates/poly-kv-python/` directories are legacy v1 scaffolding
# and are excluded from the workspace.
members = ["crates/quant-codec-core"]
exclude = ["crates/poly-kv", "crates/poly-kv-python"]
resolver = "2"

[package]
name = "poly-kv"
version = "0.1.0-alpha.3"
edition = "2021"
rust-version = "1.75"
description = "Shared compressed KV-cache pool for multi-agent context. Two-tier codec policy (fib-quant cold + turbo-quant hot) with typed receipts."
license = "MIT"
repository = "https://github.com/RecursiveIntell/Libraries"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"

turbo-quant = { path = "../turbo-quant", optional = true }
fib-quant = { path = "../fib-quant", optional = true }
gpu-backend = { path = "../gpu-backend", optional = true }
stack-ids = { path = "../stack-ids", optional = true }
bitemporal-runtime = { path = "../bitemporal-runtime", optional = true }
chrono = { version = "0.4", optional = true }
rayon = "1.10"
compressed-scorer = { path = "../compressed-scorer", optional = true }

[features]
# Default features: turbo + fib codec adapters + parallel pool build.
# The parallel_pool path gives 15-40x speedup on multi-core machines
# (SIMD + Rayon over vectors + Rayon over layers). Disable parallel
# (set default-features = false) to pin to single-threaded for embedded.
default = ["turbo", "fib", "parallel_pool"]
turbo = ["turbo-quant"]
fib = ["fib-quant"]
# fib-quant provides a GPU codebook_lookup path; poly-kv exposes
# the feature flag to opt into it. Off by default; see fib-quant
# Cargo.toml for the rationale on per-call H2D/D2H overhead.
gpu_codebook_lookup = ["fib-quant?/gpu_codebook_lookup", "gpu-backend?/gpu"]
# Parallelize the poly-kv outer layer loop using Rayon. The 28 layers
# in qwen3 are independent; spreading them across cores compounds the
# fib-quant Rayon wins.
parallel_pool = ["fib-quant?/parallel"]
gpu = ["gpu_codebook_lookup"]
# Use stack-ids typed IDs (EntityId, ScopeKey, TraceCtx) instead of bare strings.
typed-ids = ["dep:stack-ids"]
temporal-truth = ["dep:bitemporal-runtime", "dep:chrono"]
full-stack = ["typed-ids", "temporal-truth"]
# Adaptive per-head budget allocation from compressed-scorer.
# When enabled, attention_topk_batch_heads_adaptive is available.
adaptive-budget = ["dep:compressed-scorer"]

[dev-dependencies]
proptest = "1"
[package]
name = "gloss"
version = "1.0.0"
description = "A local-first desktop notebook/RAG app"
authors = ["sikmindz"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "gloss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# semantic-memory is always compiled and is the only backend. No preview toggle.
default = ["semantic-memory-backend", "semantic-memory-turbo-quant"]
semantic-memory-backend = ["dep:semantic-memory"]
semantic-memory-turbo-quant = [
    "semantic-memory-backend",
    "semantic-memory/turbo-quant-codec",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
# === Canonical Libraries crates ===
# Exact external sources keep clean checkouts independent of the local Libraries tree.
# llm-pipeline 0.2.0 is not published yet, so its reviewed source is vendored with
# llm-output-parser and llm-tool-runtime under src-tauri/vendor.
llm-pipeline = { path = "vendor/llm-pipeline" }
tauri-queue = "=0.3.0"

# === Tauri ===
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"

# === Async ===
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

# === Serialization ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# === HTTP (for Ollama provider) ===
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "blocking"] }

# === Embeddings + Reranking ===
fastembed = { version = "5", default-features = false, features = ["hf-hub-native-tls", "nomic-v2-moe", "ort-download-binaries-native-tls"] }
candle-core = "0.10"

# === Vector search ===
usearch = "2.25"
semantic-memory = { version = "=0.5.8", optional = true }

# === Database ===
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }

# === Text processing ===
unicode-segmentation = "1"
quick-xml = "0.41"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.12"
wait-timeout = "0.2"

# === Utilities ===
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
flate2 = "1.1"
tar = "0.4.45"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
directories = "5"
async-trait = "0.1"
regex = "1"
base64 = "0.22"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "semantic-memory-forge"
version = "0.1.1"
edition = "2021"
rust-version = "1.75.0"
description = "Forge verification truth: evidence bundles, export envelopes, and causal estimation substrate"
license = "Apache-2.0"
authors = ["Josh Stevenson <j.stevenson.cs@gmail.com>"]
readme = "README.md"
repository = "https://github.com/RecursiveIntell/semantic-memory-forge"
homepage = "https://github.com/RecursiveIntell/semantic-memory-forge"
documentation = "https://docs.rs/semantic-memory-forge"
keywords = ['forge', 'evidence', 'export', 'receipts', 'verification']

[dependencies]
stack-ids = { path = "../stack-ids" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
schemars = "0.8.22"

[dev-dependencies]
proptest = "1.0"

# LIB-005: inherit workspace lint policy
